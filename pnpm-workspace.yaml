# Every directory matched below is a workspace package. A new package only needs
# a package.json with the scripts it supports (test, lint, typecheck, build);
# the root `pnpm <script>` commands pick it up automatically.
packages:
  - apps/*
  - packages/*
  - examples/*
  - tools/*

# Refuse to install on a Node older than the engines.node floor instead of only warning.
engineStrict: true

# pnpm runs no dependency install scripts unless listed. Electron needs none: it downloads its
# binary on first run. electron-winstaller (pulled in by electron-builder) only prepares 7-Zip for
# Squirrel.Windows installers, which this repo does not build. The Supabase CLI (apps/store) needs
# none either: its binary comes in a per-platform optional dependency (@supabase/cli-<platform>).
# node-pty (apps/desktop, terminal Harnesses) ships N-API prebuilds for macOS, Linux and Windows on
# x64 and arm64, which Node and Electron both load; its install script only checks that the
# platform's prebuild is there, and compiles it with node-gyp where it is not.
allowBuilds:
  electron-winstaller: false
  node-pty: true
