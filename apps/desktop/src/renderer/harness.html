<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A Harness window's own page: the top bar and, for a terminal UI Kind, the embedded
         terminal. Same production policy as index.html; electron.vite.config.ts relaxes it while
         serving in dev only. -->

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harness Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/harness/main.tsx"></script>
  </body>
</html>
